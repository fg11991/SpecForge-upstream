model:
  target_model_path: Qwen/Qwen3.6-27B
  draft_model_config: configs/qwen3.6-27b-dspark.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  mask_token_id: 248070
data:
  train_data_path: "./cache/dataset/nemotron_v2_train.jsonl"
  max_length: 4096
  chat_template: qwen3.5
  cache_dir: cache
  build_dataset_num_proc: 64
training:
  strategy: dspark
  num_epochs: 10
  # Portable one-rank equivalent of the source recipe's global batch 512.
  batch_size: 1
  accumulation_steps: 512
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  # A recorded run of this recipe lost ~4000 steps of progress four times in
  # 10480 steps: accuracy fell from 0.55 to 0.15 within ten steps and took
  # 60-820 steps to climb back. Every onset coincided with a gradient norm of
  # 5.6-30.1 against a healthy maximum of 1.5. max_grad_norm did not help --
  # it bounds the norm, not the direction, and AdamW's per-parameter step is
  # nearly invariant to a global rescale. On that run's grad-norm trace a limit
  # of 10x the running geometric mean caught all four onsets and skipped none
  # of the 858 healthy steps.
  grad_spike_skip: "on"
  grad_spike_ratio: 10.0
  # beta2=0.999 gives exp_avg_sq a ~1000-step memory, which is what stretched
  # each of those events into hundreds of steps of suppressed learning rate.
  adam_beta2: 0.95
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  save_interval: 125
  dist_timeout: 30
  seed: 42
run_id: qwen3.6-27b-dspark-disaggregated
output_dir: outputs/qwen3.6-27b-dspark-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen3.6-27b-dspark-disaggregated/control
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices:
        - "1"
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 1073741824
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          mem_fraction_static: 0.7
